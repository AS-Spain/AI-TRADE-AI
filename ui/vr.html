<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VR Character - Lip Sync - AI-TRADE-AI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Courier New', monospace; background: #05080f; color: white; overflow: hidden; }
        #canvas-container { width: 100vw; height: 100vh; position: relative; }
        #loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 999; display: flex; align-items: center; justify-content: center; transition: opacity 0.5s; }
        #loading-overlay.hidden { opacity: 0; visibility: hidden; }
        #hud { position: fixed; top: 12px; left: 12px; z-index: 100; width: 330px; padding: 14px; background: rgba(0, 0, 0, 0.9); border: 2px solid #00ffcc; border-radius: 12px; }
        #hud h1 { margin: 0; font-size: 1.2rem; color: #00ffcc; }
        #response-text { min-height: 50px; margin: 10px 0; padding: 10px; background: rgba(0, 255, 204, 0.05); border-left: 3px solid #00ffcc; font-size: 0.85rem; color: #a6f5e0; line-height: 1.4; }
        .controls { display: flex; gap: 8px; margin-top: 10px; }
        input { flex-grow: 1; padding: 10px; background: #000; border: 1px solid #00ffcc; color: #00ffcc; border-radius: 6px; outline: none; }
        button { padding: 10px; background: #00ffcc; border: none; font-weight: bold; cursor: pointer; border-radius: 6px; color: #000; }
        #vrm-status { font-size: 0.7rem; margin-top: 10px; color: #00ffcc; }
    </style>
</head>
<body>
    <div id="loading-overlay"><div><h2 style="color:#00ffcc">Iniciando Lip-Sync...</h2></div></div>
    <div id="canvas-container"></div>
    
    <div id="hud">
        <h1 id="char-name">Luna</h1>
        <p id="char-personality" style="font-size:0.75rem; color:#888;">IA Interactiva</p>
        <div id="response-text">Escribe algo para hablar...</div>
        
        <div class="controls">
            <input type="text" id="user-input" placeholder="Di algo..." onkeypress="if(event.key==='Enter') sendChat()">
            <button onclick="sendChat()">ENVIAR</button>
        </div>
        <div id="vrm-status">💡 Status: <span id="status-val">Cargando...</span></div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.154.0/build/three.module.js",
            "three/examples/jsm/loaders/GLTFLoader": "https://unpkg.com/three@0.154.0/examples/jsm/loaders/GLTFLoader.js",
            "three/examples/jsm/controls/OrbitControls": "https://unpkg.com/three@0.154.0/examples/jsm/controls/OrbitControls.js",
            "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@2.0.2/lib/three-vrm.module.js"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader';
        import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls';
        import { VRMLoaderPlugin } from '@pixiv/three-vrm';

        let scene, camera, renderer, currentVrm, clock, controls;
        let isSpeaking = false; // Estado para controlar el movimiento de la boca

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x05080f);
            clock = new THREE.Clock();

            camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 1.4, 2.5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            const light = new THREE.DirectionalLight(0xffffff, 1.5);
            light.position.set(1, 1, 1).normalize();
            scene.add(light);
            scene.add(new THREE.AmbientLight(0x404040, 1.0));

            controls = new OrbitControls(camera, renderer.domElement);
            controls.target.set(0, 1.2, 0);
            controls.update();

            animate();
            loadCharacter();
        }

        async function loadCharacter() {
            try {
                const res = await fetch('/api/vr-character');
                const data = await res.json();
                document.getElementById('char-name').innerText = data.name;
                if (data.vrm_url) loadVRM(data.vrm_url);
            } catch (e) {
                console.error(e);
            }
        }

        function loadVRM(url) {
            const loader = new GLTFLoader();
            loader.register((parser) => new VRMLoaderPlugin(parser));
            loader.load(url, (gltf) => {
                const vrm = gltf.userData.vrm;
                currentVrm = vrm;
                scene.add(vrm.scene);
                vrm.scene.rotation.y = Math.PI;
                document.getElementById('status-val').innerText = "Conectado ✅";
                document.getElementById('loading-overlay').classList.add('hidden');
            });
        }

        // --- LÓGICA DE HABLA Y BOCA ---
        function handleLipSync(time) {
            if (!currentVrm || !currentVrm.expressionManager) return;

            if (isSpeaking) {
                // Hacemos que la boca se abra y cierre de forma natural (Sinusoide rápida)
                const mouthOpenValue = Math.abs(Math.sin(time * 15)) * 0.7; 
                currentVrm.expressionManager.setValue('aa', mouthOpenValue);
            } else {
                // Si no está hablando, cerramos la boca gradualmente
                const currentVal = currentVrm.expressionManager.getValue('aa');
                if (currentVal > 0) {
                    currentVrm.expressionManager.setValue('aa', Math.max(0, currentVal - 0.1));
                }
            }
        }

        function applyForcedPose() {
            if (!currentVrm) return;
            const humanoid = currentVrm.humanoid;
            const leftArm = humanoid.getRawBoneNode('leftUpperArm');
            const rightArm = humanoid.getRawBoneNode('rightUpperArm');
            if (leftArm && rightArm) {
                leftArm.rotation.z = 1.3; 
                rightArm.rotation.z = -1.3;
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const time = performance.now() * 0.001;

            if (currentVrm) {
                currentVrm.update(delta);
                applyForcedPose();
                handleLipSync(time); // Actualizar boca

                // Parpadeo
                if (Math.random() < 0.008 && !isSpeaking) {
                    currentVrm.expressionManager.setValue('blink', 1.0);
                    setTimeout(() => currentVrm.expressionManager.setValue('blink', 0), 150);
                }
            }

            if (controls) controls.update();
            renderer.render(scene, camera);
        }

        window.sendChat = async () => {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            document.getElementById('response-text').innerText = "...";
            input.value = "";

            try {
                const r = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({text})
                });
                const d = await r.json();
                document.getElementById('response-text').innerText = d.text;
                
                // --- INICIAR VOZ Y LIP-SYNC ---
                speakResponse(d.text);

            } catch (e) {
                document.getElementById('response-text').innerText = "Error de conexión.";
            }
        };

        function speakResponse(text) {
            if (!window.speechSynthesis) return;

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'es-ES'; // Idioma

            // Cuando empieza a hablar
            utterance.onstart = () => {
                isSpeaking = true;
                if (currentVrm && currentVrm.expressionManager) {
                    currentVrm.expressionManager.setValue('happy', 0.3); // Cara amable al hablar
                }
            };

            // Cuando termina de hablar
            utterance.onend = () => {
                isSpeaking = false;
                if (currentVrm && currentVrm.expressionManager) {
                    currentVrm.expressionManager.setValue('happy', 0);
                }
            };

            window.speechSynthesis.speak(utterance);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        init();
    </script>
</body>
</html>
