<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VR Character - Three.js + VRM</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Courier New', monospace; 
            background: #05080f; 
            color: white; 
            overflow: hidden; 
        }
        
        #canvas-container { 
            width: 100vw; 
            height: 100vh; 
            position: relative; 
        }
        
        canvas { 
            display: block; 
            width: 100%; 
            height: 100%;
        }
        
        /* Barra de carga */
        #loading-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: rgba(0, 255, 204, 0.1);
            z-index: 1000;
        }
        
        #loading-progress {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00ffcc, #88ff8f, #00ffcc);
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.8);
            transition: width 0.15s ease;
        }
        
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s, visibility 0.5s;
        }
        
        #loading-overlay.hidden {
            opacity: 0;
            visibility: hidden;
        }
        
        #loading-content {
            text-align: center;
        }
        
        #loading-content h2 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #00ffcc;
        }
        
        #loading-content p {
            font-size: 0.9rem;
            color: #a6f5e0;
            margin: 10px 0;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            margin: 20px auto;
            border: 3px solid rgba(0, 255, 204, 0.2);
            border-top: 3px solid #00ffcc;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* HUD */
        #hud { 
            position: fixed; 
            top: 12px; 
            left: 12px; 
            z-index: 100; 
            width: 330px; 
            padding: 14px; 
            background: rgba(0, 0, 0, 0.9); 
            border: 2px solid #00ffcc; 
            border-radius: 12px; 
            max-height: 85vh;
            overflow-y: auto;
        }
        
        #hud h1 { 
            margin: 0 0 10px; 
            font-size: 1.2rem; 
            color: #00ffcc;
        }
        
        #hud p { 
            margin: 6px 0; 
            font-size: 0.85rem; 
            line-height: 1.4; 
            color: #ccc;
        }
        
        #response-text { 
            min-height: 40px; 
            margin: 10px 0; 
            white-space: pre-wrap; 
            background: rgba(0, 255, 204, 0.05);
            padding: 10px;
            border-radius: 6px;
            border-left: 3px solid #00ffcc;
            color: #a6f5e0;
            font-size: 0.8rem;
        }
        
        #user-input { 
            width: calc(100% - 80px); 
            padding: 10px; 
            border-radius: 6px; 
            border: 1px solid #00ffcc; 
            background: #000; 
            color: #00ffcc;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
        }
        
        #user-input::placeholder {
            color: #005555;
        }
        
        #send-button { 
            width: 68px; 
            padding: 10px; 
            margin-left: 8px; 
            border-radius: 6px; 
            border: none; 
            background: #00ffcc; 
            color: #000; 
            font-weight: bold; 
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.8rem;
        }
        
        #send-button:hover {
            background: #88ff8f;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }
        
        #send-button:active {
            transform: scale(0.95);
        }
        
        #controls { 
            display: flex; 
            align-items: center; 
            margin-top: 10px; 
            gap: 8px;
        }
        
        #drop-zone { 
            margin-top: 12px; 
            padding: 12px; 
            border: 2px dashed #00ffcc; 
            border-radius: 8px; 
            text-align: center; 
            color: #a6f5e0; 
            background: rgba(0, 255, 204, 0.05); 
            font-size: 0.8rem;
            transition: all 0.2s;
            cursor: pointer;
        }
        
        #drop-zone.dragover { 
            background: rgba(0, 255, 204, 0.2); 
            border-color: #88ff8f;
            transform: scale(1.02);
        }
        
        a { 
            color: #00ffcc; 
            text-decoration: none; 
            font-size: 0.8rem;
        }
        
        .error-msg {
            color: #ff6b6b;
            font-size: 0.8rem;
            margin-top: 10px;
            padding: 8px;
            background: rgba(255, 100, 100, 0.1);
            border-radius: 4px;
            border-left: 3px solid #ff6b6b;
        }
    </style>
</head>
<body>
    <div id="loading-bar">
        <div id="loading-progress"></div>
    </div>
    
    <div id="loading-overlay">
        <div id="loading-content">
            <div class="spinner"></div>
            <h2>Cargando escena VR...</h2>
            <p id="loading-status">Inicializando Three.js</p>
        </div>
    </div>
    
    <div id="canvas-container"></div>
    
    <div id="hud">
        <h1 id="char-name">VR Character</h1>
        <p id="char-personality">Cargando personalidad...</p>
        <p id="char-status">Estado: <span id="status-value">idle</span></p>
        <div id="response-text">Escribe algo en el campo y pulsa ENVIAR para hablar con el personaje.</div>
        <div id="drop-zone">
            📁 Arrastra tu <strong>.vrm</strong> aquí o haz click
            <input type="file" id="vrm-file-input" accept=".vrm" style="display: none;">
        </div>
        <div id="controls">
            <input type="text" id="user-input" placeholder="Di algo..." autocomplete="off">
            <button id="send-button">ENVIAR</button>
        </div>
        <p style="margin-top: 12px; font-size: 0.75rem; color: #888;">
            💡 Modelo VRM: <span id="vrm-status">Cargando...</span>
        </p>
        <p><a href="/">← Volver a chat</a></p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@0.6.10/lib/three-vrm.umd.min.js"></script>
    
    <script>
        // Estado global
        let scene, camera, renderer;
        let vrm = null;
        let mixer = null;
        
        const emotionColors = {
            happy: 0x88ff8f,
            sad: 0x5f8cff,
            angry: 0xff5f5f,
            surprised: 0xffdd55,
            idle: 0x44ccff,
            neutral: 0xcccccc
        };
        
        // Actualizar barra de carga
        function updateLoadingProgress(percent) {
            document.getElementById('loading-progress').style.width = percent + '%';
        }
        
        function updateLoadingStatus(text) {
            document.getElementById('loading-status').textContent = text;
        }
        
        function hideLoading() {
            document.getElementById('loading-overlay').classList.add('hidden');
        }
        
        // Inicializar Three.js
        async function initThreeJS() {
            updateLoadingStatus('Inicializando Three.js...');
            
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x05080f);
            
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.2, 1.5);
            camera.lookAt(0, 1, 0);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);
            
            // Iluminación
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0x99ccff, 0.8);
            directionalLight.position.set(-1, 2, 1);
            scene.add(directionalLight);
            
            // Suelo
            const floorGeometry = new THREE.PlaneGeometry(20, 20);
            const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x1a1a2e });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = -0.1;
            scene.add(floor);
            
            updateLoadingProgress(20);
            updateLoadingStatus('Scene configurada');
        }
        
        // Cargar VRM
        async function loadVRM(vrmUrl) {
            updateLoadingStatus(`Cargando modelo VRM: ${vrmUrl.split('/').pop()}`);
            updateLoadingProgress(30);
            
            if (!vrmUrl) {
                throw new Error('No se especificó URL de VRM');
            }
            
            console.log('🔄 loadVRM() called with:', vrmUrl);
            
            try {
                const gltfLoader = new THREE.GLTFLoader();
                console.log('✅ GLTFLoader creado');
                
                return new Promise((resolve, reject) => {
                    gltfLoader.load(
                        vrmUrl,
                        async (gltf) => {
                            console.log('✅ GLTF cargado:', gltf);
                            updateLoadingProgress(60);
                            updateLoadingStatus('Procesando modelo VRM...');
                            
                            const model = gltf.scene;
                            console.log('📦 Model scene:', model);
                            
                            try {
                                // Intentar cargar VRM addon
                                console.log('🔍 Buscando THREE.VRM...');
                                let vrmData = null;
                                
                                if (typeof THREE !== 'undefined' && typeof THREE.VRM !== 'undefined') {
                                    console.log('✅ THREE.VRM disponible, procesando...');
                                    vrmData = await THREE.VRM.from(gltf);
                                    vrm = vrmData;
                                    vrm.scene.scale.set(1, 1, 1);
                                    scene.add(vrm.scene);
                                } else if (typeof VRM !== 'undefined') {
                                    console.log('✅ VRM global disponible, procesando...');
                                    vrmData = await VRM.from(gltf);
                                    vrm = vrmData;
                                    vrm.scene.scale.set(1, 1, 1);
                                    scene.add(vrm.scene);
                                } else {
                                    // Fallback: Mostrar el modelo GLTF como está
                                    console.warn('⚠️ THREE.VRM no disponible, usando fallback GLTF');
                                    const model = gltf.scene;
                                    
                                    // Centrar y escalar el modelo
                                    const box = new THREE.Box3().setFromObject(model);
                                    const size = box.getSize(new THREE.Vector3());
                                    const maxDim = Math.max(size.x, size.y, size.z);
                                    const scale = 2 / maxDim;
                                    
                                    model.scale.multiplyScalar(scale);
                                    
                                    // Centrar verticalmente
                                    box.setFromObject(model);
                                    const center = box.getCenter(new THREE.Vector3());
                                    model.position.x = -center.x;
                                    model.position.y = -center.y + 0.5;
                                    model.position.z = -center.z;
                                    
                                    scene.add(model);
                                    vrm = { scene: model, isGLTF: true };
                                    
                                    console.log('✅ Modelo GLTF agregado a la escena (fallback)');
                                }
                                
                                console.log('✅ Modelo agregado a la escena');
                                updateLoadingProgress(80);
                                updateLoadingStatus('Modelo cargado');
                                
                                document.getElementById('vrm-status').textContent = 
                                    (vrmData ? '✅ VRM: ' : '⚠️ GLTF: ') + vrmUrl.split('/').pop();
                                
                                resolve(vrm);
                            } catch (vrmError) {
                                console.error('❌ Error procesando VRM/GLTF:', vrmError);
                                reject(new Error('Error procesando modelo: ' + vrmError.message));
                            }
                        },
                        (progress) => {
                            console.log('📊 Progress:', progress.loaded, '/', progress.total);
                            const percent = 30 + (progress.loaded / progress.total) * 30;
                            updateLoadingProgress(percent);
                        },
                        (error) => {
                            console.error('❌ Error en gltfLoader.load:', error);
                            updateLoadingStatus(`❌ Error cargando VRM: ${error.message}`);
                            reject(error);
                        }
                    );
                });
            } catch (err) {
                console.error('❌ Error en loadVRM:', err);
                document.getElementById('vrm-status').textContent = '❌ Error al cargar VRM';
                throw err;
            }
        }
        
        // Animar
        function animate() {
            requestAnimationFrame(animate);
            
            const clock = new THREE.Clock();
            const delta = clock.getDelta();
            
            if (vrm) {
                vrm.update(delta);
            }
            
            renderer.render(scene, camera);
        }
        
        // Cargar personaje desde API
        async function loadCharacter() {
            updateLoadingStatus('Obteniendo configuración del personaje...');
            
            try {
                const apiUrl = '/api/vr-character';
                console.log('📡 Fetching:', apiUrl);
                
                const response = await fetch(apiUrl);
                console.log('📡 Response status:', response.status);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const text = await response.text();
                console.log('📡 Response text:', text);
                
                const data = JSON.parse(text);
                console.log('📡 Parsed data:', data);
                
                document.getElementById('char-name').textContent = data.name || 'VR Character';
                document.getElementById('char-personality').textContent = data.personality || 'Personalidad no disponible';
                
                if (data.vrm_url) {
                    console.log('🔄 VRM URL:', data.vrm_url);
                    updateLoadingProgress(25);
                    await loadVRM(data.vrm_url);
                    updateLoadingProgress(90);
                } else {
                    console.warn('⚠️ No hay modelo VRM configurado');
                    updateLoadingStatus('⚠️ No hay modelo VRM configurado');
                    updateLoadingProgress(90);
                }
            } catch (err) {
                console.error('❌ Error en loadCharacter:', err);
                updateLoadingStatus('❌ Error: ' + err.message);
                console.error(err);
            }
        }
        
        // Enviar mensaje
        async function sendChat() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            
            if (!text) return;
            
            document.getElementById('response-text').textContent = 'Enviando...';
            input.value = '';
            
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });
                
                const data = await response.json();
                document.getElementById('response-text').textContent = data.text || 'Sin respuesta';
                document.getElementById('status-value').textContent = (data.emotion || 'idle').toUpperCase();
                
                // Hablar
                if (window.speechSynthesis) {
                    const utterance = new SpeechSynthesisUtterance(data.text);
                    utterance.lang = 'es-ES';
                    window.speechSynthesis.speak(utterance);
                }
            } catch (err) {
                document.getElementById('response-text').innerHTML = 
                    `<span class="error-msg">❌ Error: ${err.message}</span>`;
            }
        }
        
        // Event listeners
        document.getElementById('send-button').addEventListener('click', sendChat);
        document.getElementById('user-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendChat();
        });
        
        // Drag and drop VRM
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('vrm-file-input');
        
        dropZone.addEventListener('click', () => fileInput.click());
        
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        
        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });
        
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.name.endsWith('.vrm')) {
                handleVRMUpload(file);
            }
        });
        
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) handleVRMUpload(file);
        });
        
        async function handleVRMUpload(file) {
            const formData = new FormData();
            formData.append('vrm', file);
            
            updateLoadingStatus(`Subiendo ${file.name}...`);
            document.getElementById('loading-overlay').classList.remove('hidden');
            
            try {
                const response = await fetch('/api/upload-vrm', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                if (data.status === 'ok') {
                    // Remover VRM anterior
                    if (vrm && vrm.scene.parent) {
                        scene.remove(vrm.scene);
                    }
                    vrm = null;
                    
                    // Cargar nuevo
                    await loadVRM(data.vrm_url);
                    updateLoadingProgress(95);
                    hideLoading();
                    dropZone.textContent = `✅ VRM cargado: ${file.name}`;
                } else {
                    throw new Error(data.message || 'Error desconocido');
                }
            } catch (err) {
                updateLoadingStatus('❌ Error: ' + err.message);
                setTimeout(hideLoading, 2000);
            }
        }
        
        // Resize handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // Iniciar
        (async () => {
            try {
                await initThreeJS();
                updateLoadingProgress(15);
                await loadCharacter();
                updateLoadingProgress(95);
                animate();
                updateLoadingProgress(100);
                setTimeout(hideLoading, 500);
            } catch (err) {
                updateLoadingStatus('❌ Error fatal: ' + err.message);
                console.error(err);
            }
        })();
    </script>
</body>
</html>
